name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # Registry paths must be lowercase; the GitHub owner is "VictusVinceere".
      - name: Lowercase owner
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/whatsapp-rag:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.lc }}/whatsapp-rag:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install SSH key
        run: |
          install -d -m 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy this service only
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash -s <<'REMOTE'
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

          cd /opt/aziz
          # Record the deployed tag in .env so it survives ai-infra deploys and
          # can be pinned to an older sha to roll back.
          if grep -q '^WHATSAPP_TAG=' .env; then
            sed -i "s|^WHATSAPP_TAG=.*|WHATSAPP_TAG=${{ github.sha }}|" .env
          else
            echo "WHATSAPP_TAG=${{ github.sha }}" >> .env
          fi

          COMPOSE="docker compose --env-file /opt/aziz/.env -f infra/compose.yml"
          # Only this service. Websites, Caddy, Postgres and n8n are untouched.
          $COMPOSE --profile apps pull --quiet whatsapp-rag
          $COMPOSE --profile apps up -d --wait --wait-timeout 180 whatsapp-rag
          docker logout ghcr.io >/dev/null 2>&1 || true
          $COMPOSE --profile apps ps whatsapp-rag
          REMOTE

      - name: Smoke test the public webhook
        run: |
          # Meta's verification handshake: the app must echo hub.challenge back
          # only when the verify token matches.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            "https://wa.azizriskulov.com/webhook?hub.mode=subscribe&hub.verify_token=wrong&hub.challenge=test")
          echo "wrong token -> HTTP $code (expect 403)"
          [ "$code" = "403" ] || echo "::warning::unexpected status for a bad verify token"
